name: Build Harbor SSH
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: flutter pub get
      - run: flutter analyze
      - run: python -m pip install -r tool/requirements-test.txt
      - run: flutter test
        env:
          HARBOR_SSH_INTEGRATION: '1'
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            output: build/windows/x64/runner/Release/
            asset: harbor-ssh-windows-setup.exe
          - os: macos-15-intel
            target: macos
            output: build/macos/Build/Products/Release/*.app
            asset: harbor-ssh-macos.dmg
          - os: ubuntu-24.04
            target: apk
            output: build/app/outputs/flutter-apk/app-*-release.apk
            asset: harbor-ssh-android-*.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify macOS credential bundle
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/harbor-keychain-smoke.keychain-db"
          original_keychain="$(security default-keychain -d user | sed 's/^ *"//;s/"$//')"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          cleanup() {
            security default-keychain -d user -s "$original_keychain" || true
            security delete-keychain "$keychain" || true
          }
          trap cleanup EXIT
          security unlock-keychain -p "$password" "$keychain"
          security default-keychain -d user -s "$keychain"
          xcrun swiftc \
            third_party/flutter_secure_storage_darwin/darwin/flutter_secure_storage_darwin/Sources/flutter_secure_storage_darwin/FlutterSecureStorage.swift \
            tool/macos_keychain_smoke.swift -o "$RUNNER_TEMP/harbor-keychain-smoke"
          "$RUNNER_TEMP/harbor-keychain-smoke"
      - name: Prepare Android release signing
        if: matrix.target == 'apk'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" || -z "$ANDROID_RELEASE_STORE_PASSWORD" ]]; then
            echo 'Android release signing secrets are missing' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/harbor-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=harbor\nstoreFile=harbor-release.jks\n' \
            "$ANDROID_RELEASE_STORE_PASSWORD" "$ANDROID_RELEASE_STORE_PASSWORD" > android/key.properties
      - name: Build with GitHub OAuth client ID
        shell: bash
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARBOR_GITHUB_CLIENT_ID }}
        run: |
          oauth_args=()
          if [[ -n "$GITHUB_OAUTH_CLIENT_ID" ]]; then
            oauth_args+=(--dart-define="GITHUB_OAUTH_CLIENT_ID=$GITHUB_OAUTH_CLIENT_ID")
          fi
          build_args=()
          if [[ '${{ matrix.target }}' == 'apk' ]]; then
            build_args+=(--split-per-abi)
          fi
          flutter build ${{ matrix.target }} --release "${build_args[@]}" "${oauth_args[@]}"
      - name: Verify macOS universal binary
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(build/macos/Build/Products/Release/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo 'Expected one macOS release app' >&2
            exit 1
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${apps[0]}/Contents/Info.plist")"
          xcrun lipo -verify_arch arm64 x86_64 "${apps[0]}/Contents/MacOS/$executable"
      - name: Verify Android release certificate
        if: matrix.target == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(printf '%s\n' "$sdk_root"/build-tools/*/apksigner | sort -V | tail -n 1)"
          if [[ ! -x "$apksigner" ]]; then
            echo 'Android apksigner is unavailable' >&2
            exit 1
          fi
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [[ ${#apks[@]} -ne 3 ]]; then
            echo 'Expected three ABI-specific release APKs' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            fingerprint="$("$apksigner" verify --print-certs "$apk" | tr -d '\r' | sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-f]+)$/\1/p' | sort -u)"
            if [[ "$fingerprint" != 'e85b20b3c6cb3d0e2e0fcb63ffd4e3681c85d69bf4203c0908b48371fb4278d7' ]]; then
              echo "Unexpected release certificate for $apk" >&2
              exit 1
            fi
            echo "Verified release certificate: $apk"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: harbor-ssh-${{ matrix.target }}
          path: ${{ matrix.output }}
      - name: Pack release asset
        if: github.event_name == 'release'
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            windows)
              choco install innosetup -y --no-progress
              version='${{ github.event.release.tag_name }}'
              version="${version#v}"
              "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DMyAppVersion=${version}" windows/installer.iss
              ;;
            macos)
              shopt -s nullglob
              apps=(build/macos/Build/Products/Release/*.app)
              mkdir -p dmg
              cp -R "${apps[0]}" dmg/
              ln -s /Applications dmg/Applications
              hdiutil create -volname 'Harbor SSH' -srcfolder dmg -ov -format UDZO '${{ matrix.asset }}'
              ;;
            apk)
              for abi in armeabi-v7a arm64-v8a x86_64; do
                cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "harbor-ssh-android-${abi}.apk"
              done
              ;;
          esac
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload '${{ github.event.release.tag_name }}' ${{ matrix.asset }} --clobber
