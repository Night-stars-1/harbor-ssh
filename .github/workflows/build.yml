name: Build Harbor SSH
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get
      - run: flutter analyze
      - run: python -m pip install -r tool/requirements-test.txt
      - run: flutter test
        env:
          HARBOR_SSH_INTEGRATION: '1'
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            output: build/windows/x64/runner/Release/
            asset: harbor-ssh-windows.zip
          - os: macos-latest
            target: macos
            output: build/macos/Build/Products/Release/*.app
            asset: harbor-ssh-macos.zip
          - os: ubuntu-latest
            target: apk
            output: build/app/outputs/flutter-apk/*.apk
            asset: harbor-ssh.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build with GitHub OAuth client ID
        shell: bash
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARBOR_GITHUB_CLIENT_ID }}
        run: |
          oauth_args=()
          if [[ -n "$GITHUB_OAUTH_CLIENT_ID" ]]; then
            oauth_args+=(--dart-define="GITHUB_OAUTH_CLIENT_ID=$GITHUB_OAUTH_CLIENT_ID")
          fi
          flutter build ${{ matrix.target }} --release "${oauth_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-ssh-${{ matrix.target }}
          path: ${{ matrix.output }}
      - name: Pack release asset
        if: github.event_name == 'release'
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            windows)
              tar -a -c -f '${{ matrix.asset }}' -C build/windows/x64/runner/Release .
              ;;
            macos)
              shopt -s nullglob
              apps=(build/macos/Build/Products/Release/*.app)
              ditto -c -k --keepParent "${apps[0]}" '${{ matrix.asset }}'
              ;;
            apk)
              cp build/app/outputs/flutter-apk/app-release.apk '${{ matrix.asset }}'
              ;;
          esac
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload '${{ github.event.release.tag_name }}' '${{ matrix.asset }}' --clobber
